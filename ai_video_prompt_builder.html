<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Prompt Builder - Split-Pane Tabbed Dashboard</title>
    <!-- Tailwind CSS loaded locally/fast -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --text-color: #18181b;
            --card-bg: #ffffff;
            --border-color: #d4d4d8;
            --header-bg: #ffffff;
            --sidebar-bg: #f4f4f5;
            --sidebar-hover: #e4e4e7;
            --input-bg: #ffffff;
            --input-text: #18181b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #18181b;
                --text-color: #f4f4f5;
                --card-bg: #27272a;
                --border-color: #3f3f46;
                --header-bg: #27272a;
                --sidebar-bg: #1f1f23;
                --sidebar-hover: #27272a;
                --input-bg: #18181b;
                --input-text: #f4f4f5;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preset-chip {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }
        .preset-chip:hover {
            opacity: 0.8;
            border-color: #3b82f6;
        }
        .chips-container {
            max-height: 220px;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        textarea, input, select {
            width: 100%;
            background: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        .tab-item {
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            transition: all 0.1s;
        }
        .tab-item:hover {
            background: var(--sidebar-hover);
        }
        .tab-item.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 1.5rem;
            border-radius: 8px;
            max-width: 450px;
            width: 100%;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <!-- STREAMING_CHUNK:Rendering header controls... -->
    <header style="background: var(--header-bg); border-color: var(--border-color);" class="border-b p-3 shadow-sm flex justify-between items-center flex-wrap gap-4 shrink-0">
        <div class="flex items-center gap-3 flex-wrap">
            <div>
                <span class="font-bold text-base block">AI Video Prompt Builder</span>
                <span class="text-[10px] opacity-70 block">Created by Bradford Risbert (<a href="mailto:trancedemon@gmail.com" class="underline">trancedemon@gmail.com</a>)</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-xs font-semibold opacity-70">Proj:</span>
                <select id="projectSelector" class="text-xs py-1 px-2 w-auto" onchange="switchProject(this.value)"></select>
                <input type="text" id="projectNameInput" class="text-xs py-1 px-2 w-28 font-semibold" onchange="renameCurrentProject(this.value)" placeholder="Project Name">
                <button class="btn text-xs py-1 px-2" onclick="createNewProject()">+ Proj</button>
                <button class="btn text-xs py-1 px-2 text-red-500" onclick="deleteCurrentProject()">Del Proj</button>
            </div>
            <div class="flex items-center gap-1 p-1 rounded border" style="border-color: var(--border-color);">
                <span class="text-xs font-semibold opacity-70">Clip:</span>
                <select id="clipSelector" class="text-xs py-1 px-2 w-auto" onchange="switchClip(this.value)"></select>
                <button class="btn text-xs py-1 px-2" onclick="createNewClip()">+ Clip</button>
                <button class="btn text-xs py-1 px-2 text-red-500" onclick="deleteCurrentClip()">Del Clip</button>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button class="btn text-xs" onclick="exportCurrentProjectJSON()">Export Proj JSON</button>
            <button class="btn text-xs" onclick="exportDataJSON()">Export All JSON</button>
            <label class="btn text-xs cursor-pointer mb-0">
                Import JSON <input type="file" accept=".json" class="hidden" onchange="handleFileImport(event)">
            </label>
            <button class="btn btn-danger text-xs" onclick="clearAllData()">Nuke All</button>
            <span id="saveStatus" class="font-mono text-xs text-emerald-500 hidden">Saved</span>
        </div>
    </header>

    <!-- STREAMING_CHUNK:Rendering split-pane layout... -->
    <div class="flex-grow flex overflow-hidden">
        
        <!-- Left Column: Navigation Tabs -->
        <aside style="background: var(--sidebar-bg); border-color: var(--border-color);" class="w-[260px] border-r flex flex-col shrink-0 overflow-y-auto p-3 gap-2">
            <div class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1 px-1">Sections</div>
            <div id="tabsContainer" class="flex flex-col gap-1.5">
                <!-- Dynamically rendered tabs -->
            </div>
            <div class="mt-auto pt-3 border-t flex flex-col gap-2" style="border-color: var(--border-color);">
                <button type="button" class="btn text-xs w-full py-2" onclick="addCustomSection()">+ Add Custom Section</button>
            </div>
        </aside>

        <!-- Center Column: Active Section Editor -->
        <main class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <div style="background: var(--card-bg); border-color: var(--border-color);" class="border rounded-lg p-4 flex flex-col gap-3 shadow-sm h-full">
                <div class="flex justify-between items-center pb-2 border-b" style="border-color: var(--border-color);">
                    <div class="flex items-center gap-2 flex-1">
                        <input type="text" id="activeSectionTitle" class="font-bold text-base border-none bg-transparent w-full" onchange="updateActiveSectionTitle(this.value)">
                    </div>
                    <div class="flex items-center gap-1">
                        <button class="btn text-xs" onclick="moveActiveTab(-1)" title="Move Up">↑</button>
                        <button class="btn text-xs" onclick="moveActiveTab(1)" title="Move Down">↓</button>
                        <button class="btn text-xs text-red-500" onclick="removeActiveSection()">Delete</button>
                    </div>
                </div>

                <div id="activePresetsContainer" class="flex flex-col gap-2">
                    <!-- Presets container for active tab -->
                </div>

                <div class="flex flex-col flex-grow">
                    <label class="text-xs font-semibold opacity-80 mb-1">Section Text Content:</label>
                    <textarea id="activeSectionText" class="prompt-field flex-grow" style="min-height: 250px;" placeholder="Type or select presets above..." oninput="updateActiveSectionText(this.value)"></textarea>
                </div>
            </div>
        </main>

        <!-- Right Column: Final Compiled Prompt (Equal width w-1/2) -->
        <section style="background: var(--card-bg); border-color: var(--border-color);" class="w-1/2 border-l p-4 flex flex-col shrink-0 gap-3">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-sm">Compiled Prompt</span>
                    <select id="outputFormat" class="text-xs py-1 px-2 w-auto font-normal" onchange="compilePrompt()">
                        <option value="markdown" selected>Markdown (#)</option>
                        <option value="plaintext">Plain Text</option>
                    </select>
                </div>
                <div class="flex gap-1">
                    <button class="btn text-xs py-1 px-2" onclick="copyPrompt()">Copy Output</button>
                </div>
            </div>
            <textarea id="finalOutput" class="flex-grow font-mono text-xs border rounded-md p-3" style="resize: none; background: var(--input-bg); color: var(--input-text); border-color: var(--border-color);" placeholder="Generated output appears here..."></textarea>
        </section>

    </div>

    <!-- Import Modal Overlay -->
    <div id="importModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="font-bold text-base">Import JSON Options</h3>
            <p class="text-xs opacity-80">Existing projects detected in your workspace. How would you like to import this JSON file?</p>
            <div class="flex flex-col gap-2 mt-2">
                <button class="btn btn-primary text-xs py-2" onclick="executeImport('merge')">Merge / Append as New Project(s)</button>
                <button class="btn btn-danger text-xs py-2" onclick="executeImport('overwrite')">Overwrite (Nuke) Everything & Import</button>
                <button class="btn text-xs py-2" onclick="closeImportModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- STREAMING_CHUNK:Initializing client application scripts... -->
    <script>
        let masterProjects = {
            activeProjectId: 'proj_1',
            projects: {
                'proj_1': {
                    name: 'Project 1',
                    activeClipId: 'clip_1',
                    clips: {
                        'clip_1': {
                            name: 'Clip 1',
                            lastModified: Date.now(),
                            activeTabId: 'refImages',
                            sections: [
                                { id: 'refImages', title: 'Reference Images', type: 'standard', value: '' },
                                { id: 'artStyle', title: 'Art Style & Medium', type: 'artStyle', value: '' },
                                { id: 'sceneVibes', title: 'Scene Vibes', type: 'sceneVibes', value: '' },
                                { id: 'environment', title: 'The Environment', type: 'environment', value: '' },
                                { id: 'character', title: 'Character', type: 'character', value: '' },
                                { id: 'actionScene', title: 'Action Scene', type: 'actionScene', value: '' },
                                { id: 'physics', title: 'Physics & Mechanics', type: 'physics', value: '' },
                                { id: 'cinematography', title: 'Cinematography & Camera', type: 'cinematography', value: '' },
                                { id: 'rules', title: 'Rules & Constraints', type: 'rules', value: '' }
                            ]
                        }
                    }
                }
            }
        };

        const presetLibraries = {
            artStyle: [
                "Highly stylized 2D digital anime-realism illustration, manhwa/webtoon key visual style, crisp ink contour line art combined with hyper-rendered digital painting, high-contrast studio lighting.",
                "1990s retro OVA anime aesthetic, cel-shaded animation style, thick ink outlines, authentic vintage analog film grain, VHS color grading.",
                "2D Sakuga action anime key visual, highly dynamic fluid character motion lines, intense smear frames, high-contrast cel shading.",
                "Castlevania Nocturne dark gothic animated series style, rich painterly textures, dramatic chiaroscuro lighting.",
                "Retro 80s He-Man and Masters of the Universe cel cartoon style, bold thick ink lines, vibrant primary colors.",
                "Cinematic hyper-realistic 35mm film shot, anamorphic lens flare, volumetric lighting, photorealistic textures.",
                "Gritty cyberpunk neo-noir anime, neon reflections, deep shadows, moody cyan and magenta color grading.",
                "Studio Ghibli lush hand-painted watercolor aesthetic, soft ambient lighting, whimsical pastoral beauty.",
                "Dark fantasy grimdark concept art, intricate cross-hatching, moody atmospheric haze.",
                "Ufotable high-octane magical combat digital compositing, vibrant particle effects, luminous glow rendering.",
                "Kyoto Animation delicate soft pastel lighting, exquisite eye reflections, highly detailed emotional facial expressions.",
                "Trigger hyper-kinetic dynamic exaggerated perspective, bold marker stroke lines, neon pop-art color saturation.",
                "Makoto Shinkai breathtaking skyscapes, hyper-detailed cloud shafts, radiant sun flare, luminous optical bloom.",
                "Satoshi Kon psychological surrealism, blurring dream and reality, eerie cinematic staging.",
                "Weta digital blockbuster cinematic CGI rendering, physical ray-traced reflections, subsurface skin scattering.",
                "Noir graphic novel ink wash, stark high contrast black and white shadows, moody cinematic framing.",
                "Cyberpunk edgerunners neon glitch aesthetics, vibrant saturated magenta and yellow hues, hyper-stylized lines.",
                "Pixar 3D animated feature film aesthetic, subsurface scattering, stylized friendly proportions, warm lighting.",
                "Soulslike dark fantasy, ash particles, crumbling gothic architecture, cold desaturated tones.",
                "Vintage 1980s VHS anime mecha aesthetic, chunky mechanical paneling lines, analog TV static bleed.",
                "Hyper-stylized manhwa martial arts battle manhua ink strokes, flying sweat and chi aura particle effects.",
                "Surrealist dreamscape artistic painting, melting geometry, impossible perspective, ethereal fog.",
                "Claymation stop-motion aesthetic, thumbprint textures, tactile physical miniature lighting.",
                "Vintage 1950s classic comic book halftone dot print, bold primary colors, newsprint paper grain texture.",
                "Impressionist oil painting brushstrokes, visible thick paint texture, emotive light blending."
            ],
            sceneVibes: [
                "Suspense adventure unpredictability with high psychological tension and hazardous peril.",
                "Dark psychological horror with oppressive dread and terrifying atmosphere.",
                "Gritty cyberpunk noir with neon rain, cynical mood, and high-tech dystopia.",
                "Epic high fantasy adventure with mystical wonder and ancient magical resonance.",
                "Intense action-thriller pulse-pounding urgency with relentless pacing.",
                "Melancholic post-apocalyptic isolation with desolate silence and haunting beauty.",
                "Mysterious occult investigative tension with shadowy secrets and arcane discovery.",
                "Breathtaking romantic dramatic yearning with soft ambient lighting and emotional resonance.",
                "Desperate survival struggle against insurmountable odds in a hostile environment.",
                "High-energy triumphant victory celebration with warm sunlight breaking through storm clouds.",
                "Claustrophobic underground cave dread with dripping water echoes and stifling darkness.",
                "Eerie otherworldly cosmic horror vibe with alien geometries and mind-bending stillness.",
                "Melancholy rainy city loneliness with neon lights reflecting in street puddles.",
                "Whimsical fairytale enchantment with glowing flora and magical dust motes dancing in air.",
                "Gritty medieval battlefield grit with smoke haze, clashing steel resonance, and mud."
            ],
            environment: [
                "Ancient ruins with cracked stone walls, moss-covered pillars, a yawning pit of green acidic bubbling fluid with digesting skeletons, and a horizontal rope across the chasm.",
                "Luxury VIP penthouse hotel room featuring floor-to-ceiling glass windows overlooking a glittering cyberpunk metropolis skyline, polished marble floors.",
                "Dilapidated cyberpunk hacker den with exposed conduit wires, flickering holographic computer monitors casting blue glow, and stacked server racks.",
                "Gothic cathedral interior with soaring ribbed vaulted ceilings, enormous stained-glass windows throwing colored light rays, and towering stone columns.",
                "Traditional minimalist Japanese tatami room with sliding shoji paper doors, warm paper lantern glow, and peaceful indoor rock garden courtyard view."
            ],
            character: [
                "Physique: Athletic mesomorph build with balanced proportional muscle definition.",
                "Physique: Ectomorph slender lean frame with long graceful limbs.",
                "Physique: Sinewy wiry muscle structure with hardened tendon definition.",
                "Personality: Stoic, unflinching, cold focus with absolute emotional control.",
                "Personality: Paranoid, darting watchful eyes, hyper-vigilant scanning surroundings.",
                "Personality: Stealthy, cat-like silent movements, predatory grace.",
                "Wardrobe: Pink leotard with halter neck style, large square neck hole, large leg holes extended up to waist, paired with an elegant dark leather belt.",
                "Wardrobe: Tight-fit dress with trailing skirt, premium fluid fabric, and tight elegant waist belt.",
                "Wardrobe: Tactical combat gear with reinforced Kevlar plating, utility webbing, and durable cargo trousers."
            ],
            cinematography: [
                "Multiple dynamic cinematic camera cuts every 0.3 seconds emphasizing fast-paced action and emotional tension.",
                "Multiple dynamic cinematic camera cuts every 0.5 seconds emphasizing rapid rhythm and drama.",
                "Multiple dynamic cinematic camera cuts every 1 second emphasizing balanced pacing and movement.",
                "Multiple dynamic cinematic camera cuts every 2 seconds for smooth dramatic shifts.",
                "Constant smooth tracking camera side-profile shot following character movement.",
                "Constant smooth orbiting camera panning 360 degrees around the character.",
                "Dramatic low-angle hero shot looking up, emphasizing scale and danger.",
                "Extreme close-up macro shot on facial expression, eyes, and sweat droplets."
            ],
            rules: [
                "Only render what is mentioned under action scene. The rest of it is only context and things that is needed to refer to when making the video. Do not render anything else.",
                "Do not make the characters notice or face the camera.",
                "The characters react and interact organically with the environment and other characters around them.",
                "Do not use reference images as video frames; only render what is mentioned under action scene.",
                "Maintain exact character physical consistency across all cuts and camera angles.",
                "Keep lighting and atmospheric conditions strictly uniform throughout the shot sequence."
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderProjectSelector();
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            compilePrompt();
        });

        function getActiveClip() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return null;
            return proj.clips[proj.activeClipId];
        }

        function renderTabs() {
            const clip = getActiveClip();
            if (!clip) return;
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';

            clip.sections.forEach((sec) => {
                const div = document.createElement('div');
                div.className = `tab-item ${sec.id === clip.activeTabId ? 'active' : ''}`;
                div.innerHTML = `<span>${sec.title}</span>`;
                div.onclick = () => {
                    saveActiveSectionInput();
                    clip.activeTabId = sec.id;
                    renderTabs();
                    loadActiveSectionData();
                };
                container.appendChild(div);
            });
        }

        function loadActiveSectionData() {
            const clip = getActiveClip();
            if (!clip) return;
            const sec = clip.sections.find(s => s.id === clip.activeTabId);
            if (!sec) return;

            document.getElementById('activeSectionTitle').value = sec.title;
            document.getElementById('activeSectionText').value = sec.value || '';
            renderPresetsForSection(sec);
        }

        function renderPresetsForSection(sec) {
            const container = document.getElementById('activePresetsContainer');
            container.innerHTML = '';

            let libraryKey = sec.type;
            if (presetLibraries[libraryKey]) {
                const label = document.createElement('label');
                label.className = 'text-xs font-semibold opacity-80 block mb-1';
                label.innerText = `Presets for ${sec.title} (Click to append):`;
                container.appendChild(label);

                const chipsDiv = document.createElement('div');
                chipsDiv.className = 'chips-container';

                presetLibraries[libraryKey].forEach(preset => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'preset-chip';
                    btn.innerText = preset;
                    btn.onclick = () => {
                        const ta = document.getElementById('activeSectionText');
                        ta.value = ta.value.trim() !== '' ? ta.value + ' ' + preset : preset;
                        updateActiveSectionText(ta.value);
                    };
                    chipsDiv.appendChild(btn);
                });
                container.appendChild(chipsDiv);
            }
        }

        function updateActiveSectionText(val) {
            saveActiveSectionInput();
            saveToLocalStorage();
            compilePrompt();
        }

        function updateActiveSectionTitle(val) {
            const clip = getActiveClip();
            if (!clip) return;
            const sec = clip.sections.find(s => s.id === clip.activeTabId);
            if (sec && val.trim()) {
                sec.title = val.trim();
                renderTabs();
                saveToLocalStorage();
                compilePrompt();
            }
        }

        function saveActiveSectionInput() {
            const clip = getActiveClip();
            if (!clip) return;
            const sec = clip.sections.find(s => s.id === clip.activeTabId);
            if (sec) {
                const ta = document.getElementById('activeSectionText');
                if (ta) sec.value = ta.value;
            }
        }

        function moveActiveTab(direction) {
            saveActiveSectionInput();
            const clip = getActiveClip();
            if (!clip) return;
            const idx = clip.sections.findIndex(s => s.id === clip.activeTabId);
            if (idx < 0) return;

            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= clip.sections.length) return;

            const temp = clip.sections[idx];
            clip.sections[idx] = clip.sections[targetIdx];
            clip.sections[targetIdx] = temp;

            renderTabs();
            saveToLocalStorage();
            compilePrompt();
        }

        function addCustomSection() {
            saveActiveSectionInput();
            const clip = getActiveClip();
            if (!clip) return;
            const newId = 'sec_' + Date.now();
            clip.sections.push({
                id: newId,
                title: 'Custom Section',
                type: 'custom',
                value: ''
            });
            clip.activeTabId = newId;
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function removeActiveSection() {
            const clip = getActiveClip();
            if (!clip) return;
            if (clip.sections.length <= 1) {
                alert("Cannot remove the last remaining section.");
                return;
            }
            const idx = clip.sections.findIndex(s => s.id === clip.activeTabId);
            if (idx < 0) return;

            clip.sections.splice(idx, 1);
            clip.activeTabId = clip.sections[Math.max(0, idx - 1)].id;
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function ensureFullStop(text) {
            const trimmed = text.trim();
            if (!trimmed) return "";
            return ['.', '!', '?', ':', ';'].includes(trimmed.slice(-1)) ? trimmed : trimmed + '.';
        }

        function compilePrompt() {
            saveActiveSectionInput();
            const clip = getActiveClip();
            if (!clip) return;

            let compiledText = "";
            const format = document.getElementById('outputFormat').value;

            clip.sections.forEach(sec => {
                const val = sec.value.trim();
                if (val) {
                    const content = ensureFullStop(val);
                    if (format === 'markdown') {
                        compiledText += `# ${sec.title}\n${content}\n\n`;
                    } else {
                        compiledText += `--- ${sec.title} ---\n${content}\n\n`;
                    }
                }
            });

            document.getElementById('finalOutput').value = compiledText.trim();
            showSavedIndicator();
        }

        function renderProjectSelector() {
            const selector = document.getElementById('projectSelector');
            selector.innerHTML = '';
            for (const [id, proj] of Object.entries(masterProjects.projects)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = proj.name;
                if (id === masterProjects.activeProjectId) opt.selected = true;
                selector.appendChild(opt);
            }
            const activeProj = masterProjects.projects[masterProjects.activeProjectId];
            const nameInput = document.getElementById('projectNameInput');
            if (activeProj && nameInput) nameInput.value = activeProj.name;
        }

        function renameCurrentProject(newName) {
            if (!newName.trim()) return;
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (proj) {
                proj.name = newName.trim();
                renderProjectSelector();
                saveToLocalStorage();
            }
        }

        function switchProject(projId) {
            saveActiveSectionInput();
            masterProjects.activeProjectId = projId;
            const proj = masterProjects.projects[projId];
            if (proj && !proj.clips[proj.activeClipId]) {
                proj.activeClipId = Object.keys(proj.clips)[0];
            }
            renderProjectSelector();
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            compilePrompt();
        }

        function createNewProject() {
            saveActiveSectionInput();
            const newId = 'proj_' + Date.now();
            const projCount = Object.keys(masterProjects.projects).length + 1;
            const clipId = 'clip_' + Date.now();

            masterProjects.projects[newId] = {
                name: 'Project ' + projCount,
                activeClipId: clipId,
                clips: {
                    [clipId]: {
                        name: 'Clip 1',
                        lastModified: Date.now(),
                        activeTabId: 'refImages',
                        sections: [
                            { id: 'refImages', title: 'Reference Images', type: 'standard', value: '' },
                            { id: 'artStyle', title: 'Art Style & Medium', type: 'artStyle', value: '' },
                            { id: 'sceneVibes', title: 'Scene Vibes', type: 'sceneVibes', value: '' },
                            { id: 'environment', title: 'The Environment', type: 'environment', value: '' },
                            { id: 'character', title: 'Character', type: 'character', value: '' },
                            { id: 'actionScene', title: 'Action Scene', type: 'actionScene', value: '' },
                            { id: 'physics', title: 'Physics & Mechanics', type: 'physics', value: '' },
                            { id: 'cinematography', title: 'Cinematography & Camera', type: 'cinematography', value: '' },
                            { id: 'rules', title: 'Rules & Constraints', type: 'rules', value: '' }
                        ]
                    }
                }
            };
            masterProjects.activeProjectId = newId;
            renderProjectSelector();
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function deleteCurrentProject() {
            if (Object.keys(masterProjects.projects).length <= 1) {
                alert("Cannot delete the only remaining project.");
                return;
            }
            if (!confirm("Delete this entire project?")) return;
            delete masterProjects.projects[masterProjects.activeProjectId];
            masterProjects.activeProjectId = Object.keys(masterProjects.projects)[0];
            renderProjectSelector();
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function renderClipSelector() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            const selector = document.getElementById('clipSelector');
            selector.innerHTML = '';
            if (!proj) return;
            for (const [id, clip] of Object.entries(proj.clips)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = clip.name;
                if (id === proj.activeClipId) opt.selected = true;
                selector.appendChild(opt);
            }
        }

        function switchClip(clipId) {
            saveActiveSectionInput();
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (proj) {
                proj.activeClipId = clipId;
                renderTabs();
                loadActiveSectionData();
                compilePrompt();
            }
        }

        function createNewClip() {
            saveActiveSectionInput();
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return;
            const newClipId = 'clip_' + Date.now();
            const clipCount = Object.keys(proj.clips).length + 1;
            const activeClip = proj.clips[proj.activeClipId];

            proj.clips[newClipId] = {
                name: 'Clip ' + clipCount,
                lastModified: Date.now(),
                activeTabId: activeClip.activeTabId,
                sections: JSON.parse(JSON.stringify(activeClip.sections))
            };
            proj.activeClipId = newClipId;
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function deleteCurrentClip() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj || Object.keys(proj.clips).length <= 1) {
                alert("Cannot delete the only remaining clip.");
                return;
            }
            if (!confirm("Delete this clip?")) return;
            delete proj.clips[proj.activeClipId];
            proj.activeClipId = Object.keys(proj.clips)[0];
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            saveToLocalStorage();
            compilePrompt();
        }

        function saveToLocalStorage() {
            saveActiveSectionInput();
            localStorage.setItem('ai_video_prompt_dashboard_v16', JSON.stringify(masterProjects));
            showSavedIndicator();
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('ai_video_prompt_dashboard_v16');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.projects) {
                        masterProjects = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function convertOldFormatToNew(imported) {
            let converted = {
                activeProjectId: 'proj_1',
                projects: {}
            };

            const standardTypes = {
                refImages: 'standard',
                artStyle: 'artStyle',
                sceneVibes: 'sceneVibes',
                environment: 'environment',
                character: 'character',
                actionScene: 'actionScene',
                physics: 'physics',
                cinematography: 'cinematography',
                rules: 'rules'
            };

            if (imported.projects) {
                for (const [pKey, pVal] of Object.entries(imported.projects)) {
                    let newProj = {
                        name: pVal.name || 'Imported Project',
                        activeClipId: pVal.activeClipId || Object.keys(pVal.clips || {})[0],
                        clips: {}
                    };

                    if (pVal.clips) {
                        for (const [cKey, cVal] of Object.entries(pVal.clips)) {
                            let sections = [];
                            let order = cVal.order || Object.keys(cVal.titles || {});
                            if (order.length === 0) {
                                order = ['refImages', 'artStyle', 'sceneVibes', 'environment', 'character', 'actionScene', 'physics', 'cinematography', 'rules'];
                            }

                            order.forEach(sId => {
                                let title = (cVal.titles && cVal.titles[sId]) ? cVal.titles[sId] : sId;
                                let val = '';
                                if (cVal.fields && cVal.fields[sId] !== undefined) {
                                    val = cVal.fields[sId];
                                } else if (sId === 'customRulesInput' && cVal.customRules) {
                                    val = cVal.customRules;
                                }
                                sections.push({
                                    id: sId,
                                    title: title,
                                    type: standardTypes[sId] || 'custom',
                                    value: val
                                });
                            });

                            if (cVal.extras && Array.isArray(cVal.extras)) {
                                cVal.extras.forEach((ex, idx) => {
                                    sections.push({
                                        id: 'extra_' + idx + '_' + Date.now(),
                                        title: ex.title || 'Custom Section',
                                        type: 'custom',
                                        value: ex.content || ''
                                    });
                                });
                            }

                            newProj.clips[cKey] = {
                                name: cVal.name || 'Clip',
                                lastModified: cVal.lastModified || Date.now(),
                                activeTabId: sections[0] ? sections[0].id : 'refImages',
                                sections: sections
                            };
                        }
                    }
                    converted.projects[pKey] = newProj;
                }
                if (imported.activeProjectId && converted.projects[imported.activeProjectId]) {
                    converted.activeProjectId = imported.activeProjectId;
                } else {
                    converted.activeProjectId = Object.keys(converted.projects)[0];
                }
            }
            return converted;
        }

        let pendingImportData = null;

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let imported = JSON.parse(e.target.result);
                    if (imported && imported.projects) {
                        pendingImportData = convertOldFormatToNew(imported);
                    } else if (imported && imported.clips) {
                        let convertedSingle = { activeProjectId: 'proj_imp', projects: { 'proj_imp': imported } };
                        pendingImportData = convertOldFormatToNew(convertedSingle);
                    }
                    document.getElementById('importModal').classList.remove('hidden');
                } catch (err) {
                    console.error(err);
                    alert("Invalid JSON file format.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            pendingImportData = null;
        }

        function executeImport(mode) {
            if (!pendingImportData) return;
            if (mode === 'overwrite') {
                masterProjects = pendingImportData;
            } else if (mode === 'merge') {
                for (const [pId, pObj] of Object.entries(pendingImportData.projects)) {
                    let uniqueId = pId;
                    while (masterProjects.projects[uniqueId]) {
                        uniqueId = 'proj_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
                    }
                    masterProjects.projects[uniqueId] = pObj;
                }
                masterProjects.activeProjectId = Object.keys(masterProjects.projects)[0];
            }
            closeImportModal();
            renderProjectSelector();
            renderClipSelector();
            renderTabs();
            loadActiveSectionData();
            compilePrompt();
            saveToLocalStorage();
            alert("Backup file successfully imported!");
        }

        function clearAllData() {
            if (!confirm("Are you sure you want to nuke all projects and clips?")) return;
            localStorage.removeItem('ai_video_prompt_dashboard_v16');
            location.reload();
        }

        function exportCurrentProjectJSON() {
            saveActiveSectionInput();
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(proj, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `${proj.name.toLowerCase().replace(/\s+/g, '_')}_export.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function exportDataJSON() {
            saveActiveSectionInput();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masterProjects, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "all_prompt_dashboard_projects.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function showSavedIndicator() {
            const indicator = document.getElementById('saveStatus');
            if (indicator) {
                indicator.classList.remove('hidden');
                setTimeout(() => indicator.classList.add('hidden'), 1000);
            }
        }

        function copyPrompt() {
            const finalOutput = document.getElementById('finalOutput');
            if (!finalOutput.value.trim()) return;
            finalOutput.select();
            document.execCommand('copy');
            alert("Copied to clipboard!");
        }
    </script>
