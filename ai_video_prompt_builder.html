<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Prompt Builder - Clean Dashboard</title>
    <!-- Tailwind CSS loaded locally/fast -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f4f4f5;
            color: #18181b;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .dashboard-card {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .preset-chip {
            background-color: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }
        .preset-chip:hover {
            background-color: #e4e4e7;
            border-color: #a1a1aa;
        }
        .chips-container {
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #fafafa;
            border: 1px solid #e4e4e7;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        textarea, input, select {
            width: 100%;
            background: #ffffff;
            color: #18181b;
            border: 1px solid #d4d4d8;
            border-radius: 6px;
            padding: 0.5rem;
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn:hover {
            background: #e4e4e7;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- STREAMING_CHUNK:Rendering header controls... -->
    <header class="sticky top-0 z-50 bg-white border-b border-zinc-200 p-4 shadow-sm flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-3 flex-wrap">
            <span class="font-bold text-lg">Prompt Dashboard</span>
            <div class="flex items-center gap-1">
                <span class="text-xs font-semibold text-zinc-500">Project:</span>
                <select id="projectSelector" class="text-xs py-1 px-2 w-auto" onchange="switchProject(this.value)"></select>
                <input type="text" id="projectNameInput" class="text-xs py-1 px-2 w-32 font-semibold" onchange="renameCurrentProject(this.value)" placeholder="Project Name">
                <button class="btn text-xs py-1 px-2" onclick="createNewProject()">+ Proj</button>
                <button class="btn text-xs py-1 px-2 text-red-600" onclick="deleteCurrentProject()">Del Proj</button>
            </div>
            <div class="flex items-center gap-1 bg-zinc-50 p-1 rounded border border-zinc-200">
                <span class="text-xs font-semibold text-zinc-500">Clip:</span>
                <select id="clipSelector" class="text-xs py-1 px-2 w-auto" onchange="switchClip(this.value)"></select>
                <button class="btn text-xs py-1 px-2" onclick="createNewClip()">+ Clip</button>
                <button class="btn text-xs py-1 px-2 text-red-600" onclick="deleteCurrentClip()">Del Clip</button>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button class="btn text-xs" onclick="exportDataJSON()">Export JSON</button>
            <label class="btn text-xs cursor-pointer mb-0">
                Import JSON <input type="file" accept=".json" class="hidden" onchange="importDataJSON(event)">
            </label>
            <button class="btn btn-danger text-xs" onclick="clearAllData()">Nuke All</button>
        </div>
    </header>

    <!-- STREAMING_CHUNK:Rendering main dashboard layout... -->

        </div>

                <button type="button" class="preset-chip" onclick="applyPreset('artStyle', 'Soulslike dark fantasy, ash particles, crumbling gothic architecture, cold desaturated tones.')">Soulslike Dark Fantasy</button>
                <button type="button" class="preset-chip" onclick="applyPreset('artStyle', 'Vintage 1980s VHS anime mecha aesthetic, chunky mechanical paneling lines, analog TV static bleed.')">80s VHS Mecha Anime</button>

            </div>

            <textarea id="cinematography" class="prompt-field mt-2" style="min-height: 80px;" placeholder="Camera directives..."></textarea>

        <!-- Rules Card -->
        <div class="dashboard-card">
            <div class="flex justify-between items-center mb-2">
                <input type="text" class="font-bold text-base w-auto border-none bg-transparent" value="Rules & Constraints" id="title_rules" onchange="saveToLocalStorage()">
                <button class="btn text-xs text-red-600" onclick="this.closest('.dashboard-card').remove(); saveToLocalStorage();">Remove Block</button>
            </div>
            <label class="text-xs font-semibold text-zinc-600 block mb-1">Select Rules & Constraints Presets:</label>
            <div class="chips-container">
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'Only render what is mentioned under action scene. The rest of it is only context and things that is needed to refer to when making the video. Do not render anything else.')">Strict Action Scope Guard</button>
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'Do not make the characters notice or face the camera.')">Never Look at Camera</button>
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'The characters react and interact organically with the environment and other characters around them.')">Organic Environment Interaction</button>
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'Do not use reference images as video frames; only render what is mentioned under action scene.')">No Ref Images as Frames</button>
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'Maintain exact character physical consistency across all cuts and camera angles.')">Strict Character Consistency</button>
                <button type="button" class="preset-chip" onclick="applyPreset('rules', 'Keep lighting and atmospheric conditions strictly uniform throughout the shot sequence.')">Uniform Atmospheric Lighting</button>
            </div>
            <textarea id="rules" class="prompt-field mt-2" style="min-height: 80px;" placeholder="Rules..."></textarea>
        </div>

        <div id="extraSectionsContainer"></div>

        <div class="flex justify-center my-2">
            <button type="button" class="btn" onclick="addExtraSection()">+ Add Custom Section</button>
        </div>

        <!-- Permanent Large Compiled Output Card -->
        <div class="dashboard-card" style="background: #ffffff; color: #18181b; border: 1px solid #d4d4d8;">
            <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-base">Final Compiled Prompt</span>
                    <label class="text-xs font-semibold flex items-center gap-1 cursor-pointer">
                        Format:
                        <select id="outputFormat" class="text-xs py-1 px-2 w-auto font-normal" onchange="compilePrompt()">
                            <option value="plaintext">Plain Text (--- Title ---)</option>
                            <option value="markdown">Markdown (# Title)</option>
                        </select>
                    </label>
                </div>
                <div class="flex gap-2">
                    <button class="btn btn-primary text-xs" onclick="compilePrompt()">Generate Prompt</button>
                    <button class="btn text-xs" onclick="copyPrompt()">Copy Output</button>
                </div>
            </div>
            <textarea id="finalOutput" style="min-height: 350px; font-family: monospace; background: #ffffff; color: #18181b; border-color: #d4d4d8;" placeholder="Click 'Generate Prompt' to compile your prompt here..."></textarea>
        </div>

    </main>

    <!-- STREAMING_CHUNK:Initializing client application scripts... -->
    <script>
        let masterProjects = {
            activeProjectId: 'proj_1',
            projects: {
                'proj_1': {
                    name: 'Project 1',
                    activeClipId: 'clip_1',
                    clips: {
                        'clip_1': {
                            name: 'Clip 1',
                            lastModified: Date.now(),
                            titles: {
                                refImages: 'Reference Images',
                                artStyle: 'Art Style & Medium',
                                sceneVibes: 'Scene Vibes',
                                environment: 'The Environment',
                                character: 'Character',
                                actionScene: 'Action Scene',
                                physics: 'Physics & Mechanics',
                                cinematography: 'Cinematography & Camera',
                                rules: 'Rules & Constraints'
                            },
                            fields: {},
                            extras: []
                        }
                    }
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderProjectSelector();
            renderClipSelector();
            loadActiveClipData();
            compilePrompt();
        });

        function checkActionSceneInactivity(textarea) {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (proj && proj.clips[proj.activeClipId]) {
                const clip = proj.clips[proj.activeClipId];
                if (clip.lastModified && (Date.now() - clip.lastModified) / 60000 >= 5) {
                    if (confirm("More than 5 minutes have passed since this clip was last modified. Do you want to continue editing this clip or create a new one?")) {
                        clip.lastModified = Date.now();
                    }
                }
            }
        }

        function applyPreset(elementId, text) {
            const el = document.getElementById(elementId);
            if (el) {
                el.value = el.value.trim() !== '' ? el.value + ' ' + text : text;
                saveToLocalStorage();
            }
        }

        function ensureFullStop(text) {
            const trimmed = text.trim();
            if (!trimmed) return "";
            return ['.', '!', '?', ':', ';'].includes(trimmed.slice(-1)) ? trimmed : trimmed + '.';
        }

        function compilePrompt() {
            saveActiveClipData();
            let compiledText = "";
            const format = document.getElementById('outputFormat').value;
            
            const standardFields = ['refImages', 'artStyle', 'sceneVibes', 'environment', 'character', 'actionScene', 'physics', 'cinematography', 'rules'];
            standardFields.forEach(id => {
                const titleInput = document.getElementById('title_' + id);
                const textarea = document.getElementById(id);
                if (textarea && textarea.value.trim()) {
                    const title = titleInput ? titleInput.value.trim() : id;
                    const content = ensureFullStop(textarea.value);
                    if (format === 'markdown') {
                        compiledText += `# ${title}\n${content}\n\n`;
                    } else {
                        compiledText += `--- ${title} ---\n${content}\n\n`;
                    }
                }
            });

            document.querySelectorAll('.extra-section-item').forEach(item => {
                const title = item.querySelector('.extra-title').value.trim() || 'Custom Section';
                const content = item.querySelector('.extra-content').value.trim();
                if (content) {
                    const formattedContent = ensureFullStop(content);
                    if (format === 'markdown') {
                        compiledText += `# ${title}\n${formattedContent}\n\n`;
                    } else {
                        compiledText += `--- ${title} ---\n${formattedContent}\n\n`;
                    }
                }
            });

            document.getElementById('finalOutput').value = compiledText.trim();
            showSavedIndicator();
        }

        function addExtraSection(savedTitle = '', savedContent = '') {
            const container = document.getElementById('extraSectionsContainer');
            const card = document.createElement('div');
            card.className = 'dashboard-card extra-section-item';
            card.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <input type="text" class="font-bold text-base w-auto border-none bg-transparent extra-title" value="${savedTitle || 'Custom Section'}" placeholder="Section Title" onchange="saveToLocalStorage()">
                    <button class="btn text-xs text-red-600" onclick="this.closest('.dashboard-card').remove(); saveToLocalStorage();">Remove Block</button>
                </div>
                <textarea class="extra-content prompt-field" style="min-height: 80px;" placeholder="Enter details...">${savedContent}</textarea>
            `;
            container.appendChild(card);
            saveToLocalStorage();
        }

        function renderProjectSelector() {
            const selector = document.getElementById('projectSelector');
            selector.innerHTML = '';
            for (const [id, proj] of Object.entries(masterProjects.projects)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = proj.name;
                if (id === masterProjects.activeProjectId) opt.selected = true;
                selector.appendChild(opt);
            }
            const activeProj = masterProjects.projects[masterProjects.activeProjectId];
            const nameInput = document.getElementById('projectNameInput');
            if (activeProj && nameInput) nameInput.value = activeProj.name;
        }

        function renameCurrentProject(newName) {
            if (!newName.trim()) return;
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (proj) {
                proj.name = newName.trim();
                renderProjectSelector();
                saveToLocalStorage();
            }
        }

        function switchProject(projId) {
            saveActiveClipData();
            masterProjects.activeProjectId = projId;
            const proj = masterProjects.projects[projId];
            if (proj && !proj.clips[proj.activeClipId]) {
                proj.activeClipId = Object.keys(proj.clips)[0];
            }
            renderProjectSelector();
            renderClipSelector();
            loadActiveClipData();
        }

        function createNewProject() {
            saveActiveClipData();
            const newId = 'proj_' + Date.now();
            const projCount = Object.keys(masterProjects.projects).length + 1;
            const clipId = 'clip_' + Date.now();

            masterProjects.projects[newId] = {
                name: 'Project ' + projCount,
                activeClipId: clipId,
                clips: {
                    [clipId]: {
                        name: 'Clip 1',
                        lastModified: Date.now(),
                        titles: { refImages: 'Reference Images', artStyle: 'Art Style & Medium', sceneVibes: 'Scene Vibes', environment: 'The Environment', character: 'Character', actionScene: 'Action Scene', physics: 'Physics & Mechanics', cinematography: 'Cinematography & Camera', rules: 'Rules & Constraints' },
                        fields: {},
                        extras: []
                    }
                }
            };
            masterProjects.activeProjectId = newId;
            renderProjectSelector();
            renderClipSelector();
            loadActiveClipData();
            saveToLocalStorage();
        }

        function deleteCurrentProject() {
            if (Object.keys(masterProjects.projects).length <= 1) {
                alert("Cannot delete the only remaining project.");
                return;
            }
            if (!confirm("Delete this entire project?")) return;
            delete masterProjects.projects[masterProjects.activeProjectId];
            masterProjects.activeProjectId = Object.keys(masterProjects.projects)[0];
            renderProjectSelector();
            renderClipSelector();
            loadActiveClipData();
            saveToLocalStorage();
        }

        function renderClipSelector() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            const selector = document.getElementById('clipSelector');
            selector.innerHTML = '';
            if (!proj) return;
            for (const [id, clip] of Object.entries(proj.clips)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = clip.name;
                if (id === proj.activeClipId) opt.selected = true;
                selector.appendChild(opt);
            }
        }

        function switchClip(clipId) {
            saveActiveClipData();
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (proj) {
                proj.activeClipId = clipId;
                loadActiveClipData();
            }
        }

        function createNewClip() {
            saveActiveClipData();
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return;
            const newClipId = 'clip_' + Date.now();
            const clipCount = Object.keys(proj.clips).length + 1;
            const activeClip = proj.clips[proj.activeClipId];

            proj.clips[newClipId] = {
                name: 'Clip ' + clipCount,
                lastModified: Date.now(),
                titles: JSON.parse(JSON.stringify(activeClip.titles)),
                fields: JSON.parse(JSON.stringify(activeClip.fields)),
                extras: JSON.parse(JSON.stringify(activeClip.extras))
            };
            proj.activeClipId = newClipId;
            renderClipSelector();
            loadActiveClipData();
            saveToLocalStorage();
        }

        function deleteCurrentClip() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj || Object.keys(proj.clips).length <= 1) {
                alert("Cannot delete the only remaining clip.");
                return;
            }
            if (!confirm("Delete this clip?")) return;
            delete proj.clips[proj.activeClipId];
            proj.activeClipId = Object.keys(proj.clips)[0];
            renderClipSelector();
            loadActiveClipData();
            saveToLocalStorage();
        }

        function saveActiveClipData() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return;
            const clip = proj.clips[proj.activeClipId];
            if (!clip) return;

            clip.fields = {};
            const standardFields = ['refImages', 'artStyle', 'sceneVibes', 'environment', 'character', 'actionScene', 'physics', 'cinematography', 'rules'];
            standardFields.forEach(id => {
                const ta = document.getElementById(id);
                if (ta) clip.fields[id] = ta.value;
                const tInput = document.getElementById('title_' + id);
                if (tInput) clip.titles[id] = tInput.value;
            });

            clip.extras = [];
            document.querySelectorAll('.extra-section-item').forEach(item => {
                clip.extras.push({
                    title: item.querySelector('.extra-title').value,
                    content: item.querySelector('.extra-content').value
                });
            });
        }

        function loadActiveClipData() {
            const proj = masterProjects.projects[masterProjects.activeProjectId];
            if (!proj) return;
            const clip = proj.clips[proj.activeClipId];
            if (!clip) return;

            const standardFields = ['refImages', 'artStyle', 'sceneVibes', 'environment', 'character', 'actionScene', 'physics', 'cinematography', 'rules'];
            standardFields.forEach(id => {
                const ta = document.getElementById(id);
                if (ta) ta.value = (clip.fields && clip.fields[id]) || '';
                const tInput = document.getElementById('title_' + id);
                if (tInput && clip.titles && clip.titles[id]) tInput.value = clip.titles[id];
            });

            document.getElementById('extraSectionsContainer').innerHTML = '';
            if (clip.extras) {
                clip.extras.forEach(ex => addExtraSection(ex.title, ex.content));
            }
            compilePrompt();
        }

        function saveToLocalStorage() {
            localStorage.setItem('ai_video_prompt_dashboard_v13', JSON.stringify(masterProjects));
            showSavedIndicator();
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('ai_video_prompt_dashboard_v13');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.projects) masterProjects = parsed;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function clearAllData() {
            if (!confirm("Are you sure you want to nuke all projects and clips?")) return;
            localStorage.removeItem('ai_video_prompt_dashboard_v13');
            location.reload();
        }

        function exportDataJSON() {
            saveActiveClipData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masterProjects, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "prompt_dashboard_projects.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.projects) {
                        masterProjects = imported;
                        renderProjectSelector();
                        renderClipSelector();
                        loadActiveClipData();
                        alert("Imported successfully!");
                    }
                } catch (err) {
                    alert("Invalid JSON file.");
                }
            };
            reader.readAsText(file);
        }

        function showSavedIndicator() {
            const indicator = document.getElementById('saveStatus');
            if (indicator) {
                indicator.classList.remove('hidden');
                setTimeout(() => indicator.classList.add('hidden'), 1000);
            }
        }

        function copyPrompt() {
            const finalOutput = document.getElementById('finalOutput');
            if (!finalOutput.value.trim()) return;
            finalOutput.select();
            document.execCommand('copy');
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
