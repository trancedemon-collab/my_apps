    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                            accent: '#8b5cf6'
                        },
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        darkBorder: '#334155'

                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }
        .vinyl-spin {
            animation: spin 12s linear infinite;
        }
        .vinyl-paused {
            animation-play-state: paused;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .visualizer-glow {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

                            { pitch: 'E4', step: 0, duration: 4 }, { pitch: 'G4', step: 4, duration: 4 }, { pitch: 'B4', step: 8, duration: 4 }, { pitch: 'A4', step: 12, duration: 4 },
                            { pitch: 'C5', step: 16, duration: 3 }, { pitch: 'B4', step: 19, duration: 1 }, { pitch: 'A4', step: 20, duration: 4 }, { pitch: 'G4', step: 24, duration: 4 },

                    },
                    {

                        notes: Array.from({ length: 64 }).flatMap((_, step) => {
                            const res = [];
                            if (step % 8 === 0 || step % 8 === 6) res.push({ pitch: 'C3', step, duration: 1 });

                        })
                    }
                ]
            }
        ];

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            let result = numChannels === 2 ? interleave(buffer.getChannelData(0), buffer.getChannelData(1)) : buffer.getChannelData(0);
            return createWavBlob(result, numChannels, sampleRate, 16);
        }

        function interleave(inputL, inputR) {
            const length = inputL.length + inputR.length;
            const result = new Float32Array(length);
            let index = 0, inputIndex = 0;
            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function createWavBlob(samples, numChannels, sampleRate, bitDepth) {
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataSize = samples.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (v, offset, str) => {
                for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function encodeMp3FromBuffer(buffer, bitrate = 192) {
            if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
                throw new Error('LameJS MP3 Encoder library not loaded. Exporting as WAV fallback.');
            }
            const channels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
            const mp3Data = [];

            const sampleBlockSize = 1152;
            const left = buffer.getChannelData(0);
            const right = channels > 1 ? buffer.getChannelData(1) : left;

            const leftInt16 = new Int16Array(left.length);
            const rightInt16 = new Int16Array(right.length);
            for (let i = 0; i < left.length; i++) {
                const sL = Math.max(-1, Math.min(1, left[i]));
                leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
                const sR = Math.max(-1, Math.min(1, right[i]));
                rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
            }

            for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
                const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
                let mp3buf;
                if (channels === 2) {
                    const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
                    mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk);
                }
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        function App() {
            // Active song state
            const [currentSong, setCurrentSong] = useState(PRESET_SONGS[0]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);
            const [masterVolume, setMasterVolume] = useState(0);
            const [activeTab, setActiveTab] = useState('player'); // player | inspector | generator

            // Modals & Generation State
            const [showImportModal, setShowImportModal] = useState(false);
            const [importText, setImportText] = useState('');
            const [importError, setImportError] = useState('');
            const [aiPrompt, setAiPrompt] = useState('An upbeat 80s Cyberpunk synthwave track with a catchy lead hook and heavy bassline');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [exportNotice, setExportNotice] = useState('');

            // Persistent Refs for Transport & Audio Logic
            const currentSongRef = useRef(currentSong);
            useEffect(() => { currentSongRef.current = currentSong; }, [currentSong]);

            const canvasRef = useRef(null);
            const synthsRef = useRef({});
            const drumSynthRef = useRef(null);
            const analyserRef = useRef(null);

            // Calculate total steps in current song
            const totalSteps = useMemo(() => {
                const maxStepInNotes = Math.max(0, ...currentSong.tracks.flatMap(t => t.notes.map(n => n.step + n.duration)));
                const sectionTotal = currentSong.sections ? currentSong.sections.reduce((acc, s) => acc + s.durationSteps, 0) : 0;
                return Math.max(maxStepInNotes, sectionTotal, 32);
            }, [currentSong]);

            // Calculate total song length in seconds
            const totalDurationSec = useMemo(() => {
                const stepSeconds = (60 / currentSong.bpm) / 4;
                return totalSteps * stepSeconds;
            }, [totalSteps, currentSong.bpm]);

            // Track active section during playback
            const currentSectionName = useMemo(() => {
                if (!currentSong.sections || currentSong.sections.length === 0) return 'Main Loop';
                let accum = 0;
                for (let sec of currentSong.sections) {
                    accum += sec.durationSteps;
                    if (currentStep < accum) return sec.name;
                }
                return currentSong.sections[currentSong.sections.length - 1].name;
            }, [currentStep, currentSong]);

            useEffect(() => {
                Tone.Transport.bpm.value = currentSong.bpm;

                // Setup Master FX / Analyser
                const analyser = new Tone.Analyser('fft', 64);
                Tone.Destination.chain(analyser);
                analyserRef.current = analyser;

                // Instrument Synths
                const synths = {};
                currentSong.tracks.forEach(trk => {
                    if (trk.type !== 'drums') {
                        let osc = 'sawtooth';
                        let attack = 0.01, decay = 0.2, sustain = 0.5, release = 0.4;
                        if (trk.type === 'bass') { osc = 'fmsawtooth'; release = 0.2; }
                        if (trk.type === 'pad') { osc = 'triangle'; attack = 0.2; release = 1.0; }

                        const synth = new Tone.PolySynth(Tone.Synth, {
                            oscillator: { type: osc },
                            envelope: { attack, decay, sustain, release }
                        }).toDestination();
                        synth.volume.value = trk.volume;
                        synths[trk.id] = synth;
                    }
                });
                synthsRef.current = synths;

                drumSynthRef.current = {
                    kick: new Tone.MembraneSynth({ volume: 3 }).toDestination(),
                    snare: new Tone.NoiseSynth({
                        noise: { type: 'white' },
                        envelope: { attack: 0.001, decay: 0.15, sustain: 0 }
                    }).toDestination(),
                    hihat: new Tone.MetalSynth({
                        frequency: 200,
                        envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
                        harmonicity: 5.1,
                        modulationIndex: 32,
                        resonance: 4000
                    }).toDestination()
                };

                return () => {
                    Object.values(synths).forEach(s => s.dispose());
                    if (drumSynthRef.current) {
                        drumSynthRef.current.kick.dispose();
                        drumSynthRef.current.snare.dispose();
                        drumSynthRef.current.hihat.dispose();
                    }
                };
            }, [currentSong]);

            useEffect(() => {
                let step = 0;
                const loop = new Tone.Loop((time) => {
                    Tone.Draw.schedule(() => {
                        setCurrentStep(step);
                    }, time);

                    const song = currentSongRef.current;
                    const maxSteps = Math.max(32, ...song.tracks.flatMap(t => t.notes.map(n => n.step + n.duration)));
                    const hasSolo = song.tracks.some(t => t.solo);

                    song.tracks.forEach(trk => {
                        if (trk.muted) return;
                        if (hasSolo && !trk.solo) return;

                        const activeNotes = trk.notes.filter(n => n.step === step);
                        activeNotes.forEach(note => {
                            if (trk.type === 'drums') {
                                if (note.pitch.startsWith('C3')) drumSynthRef.current?.kick?.triggerAttackRelease('C1', '8n', time);
                                else if (note.pitch.startsWith('D3')) drumSynthRef.current?.snare?.triggerAttackRelease('16n', time);
                                else drumSynthRef.current?.hihat?.triggerAttackRelease('32n', time);
                            } else {
                                const synth = synthsRef.current[trk.id];
                                if (synth) {
                                    const durSec = Tone.Time('16n').toSeconds() * note.duration;
                                    try { synth.triggerAttackRelease(note.pitch, durSec, time); } catch(e){}
                                }
                            }
                        });
                    });

                    step = (step + 1) % maxSteps;
                }, '16n');

                loop.start(0);

                return () => {
                    loop.dispose();
                };
            }, []);

            useEffect(() => {
                let animationId;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const renderVisualizer = () => {
                    animationId = requestAnimationFrame(renderVisualizer);
                    const width = canvas.width;
                    const height = canvas.height;
                    ctx.clearRect(0, 0, width, height);

                    const values = analyserRef.current ? analyserRef.current.getValue() : new Float32Array(32).fill(-100);
                    const barCount = 32;
                    const barWidth = width / barCount;

                    for (let i = 0; i < barCount; i++) {
                        const val = values[i] || -100;
                        const normalized = Math.max(0, (val + 100) / 100); // 0 to 1
                        const barHeight = normalized * height * 0.85;

                        const x = i * barWidth;
                        const y = height - barHeight;

                        const gradient = ctx.createLinearGradient(0, height, 0, 0);
                        gradient.addColorStop(0, '#2563eb');
                        gradient.addColorStop(0.6, '#8b5cf6');
                        gradient.addColorStop(1, '#ec4899');

                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y, barWidth - 4, barHeight, [4, 4, 0, 0]);
                        ctx.fill();
                    }
                };

                renderVisualizer();

                return () => {
                    cancelAnimationFrame(animationId);
                };
            }, []);

            const togglePlay = async () => {
                await Tone.start();
                if (isPlaying) {
                    Tone.Transport.pause();
                    setIsPlaying(false);
                } else {
                    Tone.Transport.start();
                    setIsPlaying(true);
                }
            };

            const stopPlayback = () => {
                Tone.Transport.stop();
                Tone.Transport.position = 0;
                setIsPlaying(false);
                setCurrentStep(0);
            };

            const scrubToStep = (targetStep) => {
                setCurrentStep(targetStep);
                const seconds = targetStep * ((60 / currentSong.bpm) / 4);
                Tone.Transport.seconds = seconds;
            };

            const updateTrackProp = (trackId, prop, val) => {
                setCurrentSong(prev => ({
                    ...prev,
                    tracks: prev.tracks.map(t => {
                        if (t.id === trackId) {
                            const updated = { ...t, [prop]: val };
                            if (prop === 'volume' && synthsRef.current[trackId]) {
                                synthsRef.current[trackId].volume.value = val;
                            }
                            return updated;
                        }
                        return t;
                    })
                }));
            };

            const generateSongWithAI = async () => {
                if (!aiPrompt.trim()) return;
                setIsGenerating(true);
                setExportNotice('');

                const systemInstruction = `You are a world-class AI Music Producer. Generate complete, playable structured song specifications in JSON format with sections (Intro, Verse, Chorus, Outro), instruments (lead, pad, bass, drums), tempo (BPM), and note steps. Strictly output VALID JSON without extra markdown commentary.`;
                
                const userQuery = `Create a song based on this prompt: "${aiPrompt}". Return a JSON object with this exact structure:
                {
                  "title": "Song Title",
                  "artist": "Gemini AI Producer",
                  "genre": "Genre Name",
                  "bpm": 120,
                  "key": "A Minor",
                  "sections": [{"name": "Intro", "durationSteps": 16}, {"name": "Chorus", "durationSteps": 32}],
                  "tracks": [
                    {
                      "id": "trk-1",
                      "name": "Lead Synth",
                      "type": "lead",
                      "volume": 0,
                      "muted": false,
                      "solo": false,
                      "notes": [{"pitch": "A4", "step": 0, "duration": 2}]
                    },
                    {
                      "id": "trk-2",
                      "name": "Punchy Bass",
                      "type": "bass",
                      "volume": 0,
                      "muted": false,
                      "solo": false,
                      "notes": [{"pitch": "A2", "step": 0, "duration": 1}]
                    }
                  ]
                }`;

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawJson) {
                        const parsed = JSON.parse(rawJson);
                        parsed.id = 'ai-song-' + Date.now();
                        setCurrentSong(parsed);
                        setActiveTab('player');
                        setExportNotice('✨ Song successfully generated by Gemini AI!');
                    } else {
                        throw new Error('Could not parse Gemini AI response');
                    }
                } catch(err) {
                    console.error('AI Generation Error:', err);
                    setExportNotice('⚠️ Gemini AI Generation failed. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const renderOfflineSong = async () => {
                const stepSeconds = (60 / currentSong.bpm) / 4;
                const totalDuration = totalSteps * stepSeconds;

                return await Tone.Offline(({ transport }) => {
                    transport.bpm.value = currentSong.bpm;
                    const offlineSynths = {};
                    let offlineDrums = null;

                    currentSong.tracks.forEach(trk => {
                        if (trk.muted) return;
                        if (trk.type !== 'drums') {
                            let osc = 'sawtooth';
                            if (trk.type === 'bass') osc = 'fmsawtooth';
                            if (trk.type === 'pad') osc = 'triangle';

                            const synth = new Tone.PolySynth(Tone.Synth, {
                                oscillator: { type: osc }
                            }).toDestination();
                            synth.volume.value = trk.volume;
                            offlineSynths[trk.id] = synth;
                        }
                    });

                    const hasDrums = currentSong.tracks.some(t => !t.muted && t.type === 'drums');
                    if (hasDrums) {
                        offlineDrums = {
                            kick: new Tone.MembraneSynth({ volume: 3 }).toDestination(),
                            snare: new Tone.NoiseSynth({ envelope: { decay: 0.15 } }).toDestination(),
                            hihat: new Tone.MetalSynth({ frequency: 200 }).toDestination()
                        };
                    }

                    const hasSolo = currentSong.tracks.some(t => t.solo);

                    currentSong.tracks.forEach(trk => {
                        if (trk.muted) return;
                        if (hasSolo && !trk.solo) return;

                        trk.notes.forEach(note => {
                            const startTime = note.step * stepSeconds;
                            const durTime = Math.max(0.02, note.duration * stepSeconds);

                            if (trk.type === 'drums' && offlineDrums) {
                                if (note.pitch.startsWith('C3')) try { offlineDrums.kick.triggerAttackRelease('C1', '8n', startTime); } catch(e){}
                                else if (note.pitch.startsWith('D3')) try { offlineDrums.snare.triggerAttackRelease('16n', startTime); } catch(e){}
                                else try { offlineDrums.hihat.triggerAttackRelease('32n', startTime); } catch(e){}
                            } else if (offlineSynths[trk.id]) {
                                try {
                                    offlineSynths[trk.id].triggerAttackRelease(note.pitch, durTime, startTime);
                                } catch(e){}
                            }
                        });
                    });

                    transport.start(0);
                }, totalDuration);
            };

            const exportMP3 = async () => {
                setIsExporting(true);
                setExportNotice('');
                try {
                    const buffer = await renderOfflineSong();
                    const mp3Blob = encodeMp3FromBuffer(buffer.get(), 192);
                    const url = URL.createObjectURL(mp3Blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentSong.title.replace(/\s+/g, '_')}.mp3`;
                    a.click();
                    URL.revokeObjectURL(url);
                    setExportNotice('🎉 MP3 File Downloaded!');
                } catch(e) {
                    setExportNotice('Export failed: ' + e.message);
                } finally {
                    setIsExporting(false);
                }
            };

            const exportWAV = async () => {
                setIsExporting(true);
                setExportNotice('');
                try {
                    const buffer = await renderOfflineSong();
                    const wavBlob = audioBufferToWav(buffer.get());
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentSong.title.replace(/\s+/g, '_')}.wav`;
                    a.click();
                    URL.revokeObjectURL(url);
                    setExportNotice('🎉 WAV File Downloaded!');
                } catch(e) {
                    setExportNotice('Export failed: ' + e.message);
                } finally {
                    setIsExporting(false);
                }
            };

            const handleTextImport = () => {
                setImportError('');
                try {
                    const data = JSON.parse(importText);
                    if (!data.title || !data.tracks) throw new Error('Missing title or tracks array in JSON.');
                    data.id = 'imported-' + Date.now();
                    setCurrentSong(data);
                    setShowImportModal(false);
                    setImportText('');
                } catch(e) {
                    setImportError('Invalid JSON Song Spec: ' + e.message);
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-900 text-slate-100">
                    
                    {/* Top Bar Header */}
                    <header className="h-14 bg-slate-800/80 backdrop-blur-md border-b border-slate-700/80 px-4 flex items-center justify-between shrink-0">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-purple-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/20">
                                🎵
                            </div>
                            <div>
                                <h1 className="font-bold text-sm bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                                    AI Song Media Player & MP3 Generator
                                </h1>
                                <p className="text-[10px] text-slate-400">Play, Edit & Export Text-based AI Music</p>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex bg-slate-900/60 p-1 rounded-xl border border-slate-700/50 text-xs font-medium">
                            <button
                                onClick={() => setActiveTab('player')}
                                className={`px-3 py-1 rounded-lg transition-all ${activeTab === 'player' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                📻 Jukebox Player
                            </button>
                            <button
                                onClick={() => setActiveTab('generator')}
                                className={`px-3 py-1 rounded-lg transition-all ${activeTab === 'generator' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                ✨ Gemini AI Creator
                            </button>
                            <button
                                onClick={() => setActiveTab('inspector')}
                                className={`px-3 py-1 rounded-lg transition-all ${activeTab === 'inspector' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                💻 Song Spec Code
                            </button>
                        </div>

                        {/* Preset Song Selector & Import */}
                        <div className="flex items-center space-x-2">
                            <select
                                value={currentSong.id}
                                onChange={(e) => {
                                    const selected = PRESET_SONGS.find(s => s.id === e.target.value);
                                    if (selected) {
                                        stopPlayback();
                                        setCurrentSong(selected);
                                    }
                                }}
                                className="bg-slate-900 text-xs text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500"
                            >
                                <optgroup label="Preset Songs">
                                    {PRESET_SONGS.map(s => (
                                        <option key={s.id} value={s.id}>{s.title} ({s.genre})</option>
                                    ))}
                                </optgroup>
                            </select>

                            <button
                                onClick={() => setShowImportModal(true)}
                                className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all"
                            >
                                <span>📥 Import JSON</span>
                            </button>
                        </div>
                    </header>

                    {}
                    {activeTab === 'player' && (
                        <div className="flex-1 flex flex-col p-6 overflow-y-auto space-y-6 max-w-6xl mx-auto w-full">
                            
                            {/* Notice Banner */}
                            {exportNotice && (
                                <div className="p-3 bg-blue-500/10 border border-blue-500/30 rounded-xl text-xs text-blue-300 flex items-center justify-between">
                                    <span>{exportNotice}</span>
                                    <button onClick={() => setExportNotice('')} className="font-bold">✕</button>
                                </div>
                            )}

                            {/* Main Jukebox Media Player Card */}
                            <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-2xl backdrop-blur-lg grid grid-cols-1 md:grid-cols-12 gap-6 items-center visualizer-glow">
                                
                                {/* Album Vinyl & Visualizer Column */}
                                <div className="md:col-span-5 flex flex-col items-center justify-center relative">
                                    <div className="relative w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-950 border-4 border-slate-700 shadow-2xl flex items-center justify-center overflow-hidden">
                                        
                                        {/* Vinyl Groove Ring Effects */}
                                        <div className={`absolute inset-0 rounded-full border-8 border-slate-800/40 vinyl-spin ${!isPlaying ? 'vinyl-paused' : ''}`}></div>
                                        <div className={`absolute inset-4 rounded-full border-4 border-slate-800/30 vinyl-spin ${!isPlaying ? 'vinyl-paused' : ''}`}></div>

                                        {/* Center Record Label */}
                                        <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex flex-col items-center justify-center text-center p-1 shadow-inner z-10">
                                            <span className="text-[10px] font-bold text-white uppercase tracking-wider">{currentSong.genre.split(' ')[0]}</span>
                                            <span className="text-[8px] text-blue-200">AI AUDIO</span>
                                            <div className="w-3 h-3 rounded-full bg-slate-900 border border-slate-700 mt-1"></div>
                                        </div>
                                    </div>

                                    {/* Audio Spectrum Visualizer Bar */}
                                    <canvas
                                        ref={canvasRef}
                                        width="320"
                                        height="60"
                                        className="mt-4 w-full h-14 bg-slate-900/80 rounded-xl border border-slate-700/50"
                                    ></canvas>
                                </div>

                                {/* Track Metadata & Controls Column */}
                                <div className="md:col-span-7 flex flex-col justify-between space-y-4">
                                    
                                    <div>
                                        <div className="flex items-center justify-between">
                                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">
                                                {currentSong.genre}
                                            </span>
                                            <div className="flex items-center space-x-3 text-xs text-slate-400 font-mono">
                                                <span>⏱ BPM: {currentSong.bpm}</span>
                                                <span>🎹 Key: {currentSong.key}</span>
                                            </div>
                                        </div>

                                        <h2 className="text-2xl font-black text-white mt-2">{currentSong.title}</h2>
                                        <p className="text-xs text-slate-400">Composed by: <span className="text-purple-400 font-semibold">{currentSong.artist}</span></p>
                                    </div>

                                    {/* Song Section Timeline Badges */}
                                    {currentSong.sections && (
                                        <div className="flex items-center space-x-2 overflow-x-auto py-1">
                                            {currentSong.sections.map((sec, idx) => {
                                                const isActive = currentSectionName === sec.name;
                                                return (
                                                    <span
                                                        key={idx}
                                                        className={`px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                                                            isActive
                                                                ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md scale-105 ring-2 ring-blue-400/50'
                                                                : 'bg-slate-900/60 text-slate-400 border border-slate-700/60'
                                                        }`}
                                                    >
                                                        {sec.name}
                                                    </span>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {/* Progress Bar & Time Display */}
                                    <div className="space-y-1.5">
                                        <div className="flex justify-between text-xs font-mono text-slate-400">
                                            <span>
                                                {Math.floor((currentStep * ((60 / currentSong.bpm) / 4)) / 60)}:
                                                {Math.floor((currentStep * ((60 / currentSong.bpm) / 4)) % 60).toString().padStart(2, '0')}
                                            </span>
                                            <span className="text-blue-400 font-bold">Section: {currentSectionName}</span>
                                            <span>
                                                {Math.floor(totalDurationSec / 60)}:
                                                {Math.floor(totalDurationSec % 60).toString().padStart(2, '0')}
                                            </span>
                                        </div>

                                        <div
                                            onClick={(e) => {
                                                const rect = e.currentTarget.getBoundingClientRect();
                                                const pct = (e.clientX - rect.left) / rect.width;
                                                scrubToStep(Math.floor(pct * totalSteps));
                                            }}
                                            className="h-3 bg-slate-900 rounded-full overflow-hidden cursor-pointer relative border border-slate-700/80 group"
                                        >
                                            <div
                                                className="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 transition-all duration-75 relative"
                                                style={{ width: `${(currentStep / totalSteps) * 100}%` }}
                                            >
                                                <div className="absolute right-0 top-0 bottom-0 w-2 bg-white rounded-full shadow-lg opacity-0 group-hover:opacity-100"></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Transport Controls Row */}
                                    <div className="flex items-center justify-between pt-2">
                                        <div className="flex items-center space-x-3">
                                            <button
                                                onClick={togglePlay}
                                                className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30 transition-all transform hover:scale-105 active:scale-95"
                                            >
                                                {isPlaying ? '⏸' : '▶'}
                                            </button>

                                            <button
                                                onClick={stopPlayback}
                                                className="w-10 h-10 rounded-xl bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-sm font-semibold transition-all"
                                                title="Stop & Reset"
                                            >
                                                ⏹
                                            </button>
                                        </div>

                                        {/* Audio Export Buttons */}
                                        <div className="flex items-center space-x-2">
                                            <button
                                                onClick={exportMP3}
                                                disabled={isExporting}
                                                className="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20 flex items-center space-x-1.5 transition-all"
                                            >
                                                <span>{isExporting ? '⏳ Rendering...' : '📥 Export MP3'}</span>
                                            </button>

                                            <button
                                                onClick={exportWAV}
                                                disabled={isExporting}
                                                className="px-3 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded-xl text-xs font-semibold transition-all"
                                            >
                                                <span>🔊 WAV</span>
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            {}
                            <div className="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-700/60 pb-3">
                                    <h3 className="font-bold text-sm text-slate-200 flex items-center space-x-2">
                                        <span>🎛</span>
                                        <span>Multi-Track Mixer ({currentSong.tracks.length} Stems)</span>
                                    </h3>
                                    <span className="text-xs text-slate-400">Adjust individual track gain, mute & solo</span>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                    {currentSong.tracks.map(trk => (
                                        <div key={trk.id} className="bg-slate-900/60 border border-slate-700/60 rounded-xl p-3.5 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <span className="font-semibold text-xs text-slate-200 truncate">{trk.name}</span>
                                                <span className="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded bg-slate-800 text-blue-400">
                                                    {trk.type}
                                                </span>
                                            </div>

                                            <div className="flex items-center space-x-2">
                                                <button
                                                    onClick={() => updateTrackProp(trk.id, 'muted', !trk.muted)}
                                                    className={`px-2 py-1 rounded text-[10px] font-bold ${trk.muted ? 'bg-red-500 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                                >
                                                    MUTE
                                                </button>
                                                <button
                                                    onClick={() => updateTrackProp(trk.id, 'solo', !trk.solo)}
                                                    className={`px-2 py-1 rounded text-[10px] font-bold ${trk.solo ? 'bg-amber-500 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                                >
                                                    SOLO
                                                </button>
                                                <div className="flex-1 text-right text-xs font-mono text-slate-400">
                                                    {trk.volume} dB
                                                </div>
                                            </div>

                                            <input
                                                type="range"
                                                min="-24"
                                                max="6"
                                                value={trk.volume}
                                                onChange={(e) => updateTrackProp(trk.id, 'volume', Number(e.target.value))}
                                                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    )}

                    {}
                    {activeTab === 'generator' && (
                        <div className="flex-1 p-6 overflow-y-auto max-w-4xl mx-auto w-full space-y-6">
                            <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 space-y-4">
                                <div className="flex items-center space-x-3">
                                    <span className="text-2xl">✨</span>
                                    <div>
                                        <h2 className="text-lg font-bold text-white">Generate Full Songs with Gemini AI</h2>
                                        <p className="text-xs text-slate-400">Describe any song idea, genre, or vibe. Gemini will write the structured multi-track song specification for immediate playback.</p>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-xs font-semibold text-slate-300">Prompt / Song Description</label>
                                    <textarea
                                        rows="4"
                                        value={aiPrompt}
                                        onChange={(e) => setAiPrompt(e.target.value)}
                                        placeholder="e.g. A melancholic lofi beat in F Minor with lush chords, a sub bass line, and electric piano melody..."
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500"
                                    ></textarea>
                                </div>

                                <button
                                    onClick={generateSongWithAI}
                                    disabled={isGenerating}
                                    className="w-full py-3 bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white rounded-xl font-bold text-xs shadow-lg shadow-purple-600/30 disabled:opacity-50 flex items-center justify-center space-x-2 transition-all"
                                >
                                    <span>{isGenerating ? '⏳ Gemini AI is composing song structure...' : '🚀 Compose Song & Load into Jukebox'}</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {}
                    {activeTab === 'inspector' && (
                        <div className="flex-1 p-6 overflow-y-auto max-w-5xl mx-auto w-full space-y-4">
                            <div className="flex items-center justify-between">
                                <h2 className="text-sm font-bold text-slate-200">Song Specification JSON</h2>
                                <button
                                    onClick={() => {
                                        navigator.clipboard.writeText(JSON.stringify(currentSong, null, 2));
                                        setExportNotice('📋 JSON Copied to Clipboard!');
                                    }}
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded-lg font-semibold"
                                >
                                    📋 Copy JSON
                                </button>
                            </div>

                            <textarea
                                readOnly
                                rows="22"
                                value={JSON.stringify(currentSong, null, 2)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs font-mono text-emerald-400 focus:outline-none leading-relaxed"
                            ></textarea>
                        </div>
                    )}

                    {}
                    {showImportModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
                                <div className="p-4 border-b border-slate-700 flex items-center justify-between">
                                    <h3 className="font-bold text-sm text-white">Import AI Song Spec JSON</h3>
                                    <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>

                                <div className="p-4 space-y-3">
                                    <textarea
                                        rows="12"
                                        value={importText}
                                        onChange={(e) => setImportText(e.target.value)}
                                        placeholder="Paste full JSON song spec here..."
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none"
                                    ></textarea>

                                    {importError && (
                                        <div className="p-2.5 bg-red-500/20 text-red-300 border border-red-500/30 text-xs rounded-xl">
                                            {importError}
                                        </div>
                                    )}
                                </div>

                                <div className="p-4 border-t border-slate-700 flex justify-end space-x-2">
                                    <button onClick={() => setShowImportModal(false)} className="px-3 py-1.5 bg-slate-700 text-xs rounded-lg font-semibold">Cancel</button>
                                    <button onClick={handleTextImport} className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs rounded-lg font-bold">Load Song</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
