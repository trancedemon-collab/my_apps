<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            background: #222; margin: 0; padding: 10px; height: 100vh;
            box-sizing: border-box; overflow: hidden;
        }
        /* Canvas takes 75% of vertical space, leaving 25% for buttons/padding */
        canvas { 
            width: 100%; max-width: 500px; height: 75vh; 
            border: 1px solid #444; background: transparent; 
        }
        button { 
            padding: 20px 60px; font-size: 1.5rem; margin-top: 20px; 
            cursor: pointer; border-radius: 12px; border: none; 
            background: #007bff; color: white; touch-action: manipulation;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<button onclick="playPunch()">Punch</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const standing = new Image();
const punching = new Image();
standing.crossOrigin = "Anonymous";
punching.crossOrigin = "Anonymous";

standing.src = 'https://trancedemon-collab.github.io/my_apps/billy-standing.png';
punching.src = 'https://trancedemon-collab.github.io/my_apps/billy-punching.png';

let currentImg = standing;

// Dynamically set canvas internal resolution
function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const imgRatio = currentImg.width / currentImg.height;
    const canvasRatio = canvas.width / canvas.height;
    let w, h, x, y;

    if (imgRatio > canvasRatio) {
        w = canvas.width;
        h = canvas.width / imgRatio;
    } else {
        h = canvas.height;
        w = canvas.height * imgRatio;
    }
    x = (canvas.width - w) / 2;
    y = (canvas.height - h) / 2;

    ctx.drawImage(currentImg, x, y, w, h);
    
    let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let data = frame.data;
    for (let i = 0; i < data.length; i += 4) {
        if (data[i+1] > 150 && data[i] < 100 && data[i+2] < 100) data[i+3] = 0;
    }
    ctx.putImageData(frame, 0, 0);
    requestAnimationFrame(draw);
}

function playPunch() {
    currentImg = punching;
    setTimeout(() => { currentImg = standing; }, 500);
}

window.addEventListener('resize', resize);
resize();
let loaded = 0;
const onImgLoad = () => { if (++loaded === 2) draw(); };
standing.onload = onImgLoad;
punching.onload = onImgLoad;
</script>
</body>
</html>
